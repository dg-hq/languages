name: Test the tools

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: node --version && node --test tests/build-pack.test.mjs
      # The fixture root holds two es minors, so the tools are tested on several minors side by side.
      - run: node tools/build-all.mjs "$RUNNER_TEMP/out" --root tests/fixtures/root
      # The real catalogues, as the release builds them, so a pack buildPack refuses fails here and not at the tag (Ekow's Low on #2).
      - run: node tools/build-all.mjs "$RUNNER_TEMP/real"
